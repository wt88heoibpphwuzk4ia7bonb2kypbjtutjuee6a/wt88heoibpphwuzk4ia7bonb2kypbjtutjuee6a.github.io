<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#003366">
<title>Cairo Metro Subscription Calculator</title>
<style>
:root {
  --helwan-blue: #003366;
  --helwan-blue-dark: #00234d;
  --helwan-gold: #FFD700;
  --background-white: #FFFFFF;
  --background-light-gray: #F8F9FA;
  --text-dark: #212529;
  --text-light: #495057;
  --border-color: #DEE2E6;
  --focus-outline-color: #005fcc;
}

@font-face {
  font-family: 'IBM Plex Sans Arabic';
  src: url('https://helwan-hostel-students.github.io/fonts/IBMPlexSansArabic-Light.woff2') format('woff2');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Sans Arabic';
  src: url('https://helwan-hostel-students.github.io/fonts/IBMPlexSansArabic-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Sans Arabic';
  src: url('https://helwan-hostel-students.github.io/fonts/IBMPlexSansArabic-Medium.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Sans Arabic';
  src: url('https://helwan-hostel-students.github.io/fonts/IBMPlexSansArabic-SemiBold.woff2') format('woff2');
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Sans Arabic';
  src: url('https://helwan-hostel-students.github.io/fonts/IBMPlexSansArabic-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

* { box-sizing: border-box; }
::selection { background: var(--helwan-gold); color: var(--helwan-blue); }
:focus-visible { outline: 3px solid var(--focus-outline-color); outline-offset: 2px; }

body {
  margin: 0;
  background: var(--background-white);
  color: var(--text-dark);
  font-family: 'IBM Plex Sans Arabic', Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.container { max-width: 900px; margin: 0 auto; padding: 2rem; }
.app-header { position: relative; padding-top: 3.1rem; }
h1 {
  margin: 0 0 2rem;
  color: var(--helwan-blue);
  font-size: 2.8rem;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  overflow-wrap: anywhere;
}

button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
#lang-toggle {
  position: absolute;
  inset-block-start: 0;
  inset-inline-end: 0;
  padding: .55rem 1.2rem;
  border: 1px solid var(--helwan-blue);
  border-radius: 50px;
  background: var(--helwan-blue);
  color: var(--background-white);
  font-size: .95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background-color .2s ease, color .2s ease, transform .2s ease;
}
#lang-toggle:hover { background: var(--helwan-gold); color: var(--helwan-blue); border-color: var(--helwan-gold); }

fieldset {
  min-width: 0;
  margin: 1.5rem 0 0;
  padding: 1.25rem 1.5rem 1.5rem;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  background: var(--background-light-gray);
  transition: box-shadow .25s ease;
}
fieldset:hover { box-shadow: 0 4px 15px rgba(0, 0, 0, .055); }
legend {
  max-width: 100%;
  padding: 0 .65rem;
  color: var(--helwan-blue);
  font-size: 1.35rem;
  font-weight: 600;
  line-height: 1.4;
}
[hidden] { display: none !important; }

#stations-fieldset {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: .9rem 1rem;
}
#stations-fieldset > legend,
#stations-fieldset > #reminder { grid-column: 1 / -1; }
#stations-fieldset .station-field { position: relative; min-width: 0; }
#reminder {
  margin: 0;
  padding: .8rem 1rem;
  border-inline-start: 4px solid var(--helwan-gold);
  border-radius: 4px;
  background: #fffbe6;
  color: var(--text-light);
  font-size: .98rem;
}
label { color: var(--text-dark); font-weight: 500; }
.station-field > label { display: block; margin: 0 0 .45rem; }
input[type="text"] {
  display: block;
  width: 100%;
  min-width: 0;
  padding: .85rem 1.1rem;
  border: 1px solid var(--border-color);
  border-radius: 50px;
  background: var(--background-white);
  color: var(--text-dark);
  text-align: start;
  transition: border-color .2s ease, box-shadow .2s ease;
}
input[type="text"]::placeholder { color: #747b82; opacity: 1; }
input[type="text"]:focus {
  outline: none;
  border-color: var(--helwan-gold);
  box-shadow: 0 0 0 3px rgba(255, 215, 0, .25);
}

#type-options, #duration-options, #annual-lines-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr));
  gap: .65rem;
}
#type-options br, #duration-options br, #annual-lines-options br,
#from-list br, #to-list br { display: none; }
#type-options label, #duration-options label, #annual-lines-options label {
  display: flex;
  align-items: flex-start;
  gap: .65rem;
  min-width: 0;
  margin: 0;
  padding: .8rem 1rem;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--background-white);
  color: var(--text-light);
  font-weight: 400;
  cursor: pointer;
  transition: border-color .2s ease, background-color .2s ease, color .2s ease;
}
#type-options label:hover, #duration-options label:hover, #annual-lines-options label:hover {
  border-color: var(--helwan-gold);
  color: var(--helwan-blue);
}
#type-options label:has(input:checked),
#duration-options label:has(input:checked),
#annual-lines-options label:has(input:checked) {
  border-color: var(--helwan-blue);
  background: #edf3f8;
  color: var(--helwan-blue);
  font-weight: 600;
}
input[type="radio"] { margin: .35rem 0 0; accent-color: var(--helwan-blue); flex: 0 0 auto; }

#calculate-btn {
  display: block;
  width: 100%;
  margin: .5rem 0 0;
  padding: .9rem 1rem;
  border: 0;
  border-radius: 8px;
  background: var(--helwan-blue);
  color: var(--background-white);
  font-size: 1.15rem;
  font-weight: 600;
  cursor: pointer;
  transition: background-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
#calculate-btn:hover { background: var(--helwan-blue-dark); box-shadow: 0 4px 12px rgba(0, 51, 102, .18); }
#calculate-btn:active { transform: translateY(1px); }

#from-list, #to-list {
  display: none;
  position: absolute;
  inset-block-start: calc(100% + .35rem);
  inset-inline: 0;
  z-index: 1000;
  max-height: 300px;
  overflow-y: auto;
  padding: .35rem;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--background-white);
  box-shadow: 0 8px 16px rgba(0, 0, 0, .1);
}
#from-list:not(:empty), #to-list:not(:empty) { display: block; }
#from-list button, #to-list button {
  display: block;
  width: 100%;
  padding: .65rem .85rem;
  border: 0;
  border-bottom: 1px solid var(--border-color);
  border-radius: 4px;
  background: var(--background-white);
  color: var(--text-dark);
  text-align: start;
  cursor: pointer;
}
#from-list button:last-of-type, #to-list button:last-of-type { border-bottom: 0; }
#from-list button:hover, #to-list button:hover { background: var(--background-light-gray); color: var(--helwan-blue); }

#result { overflow-wrap: anywhere; }
#result h2 {
  margin: .3rem 0 1rem;
  padding: 0 0 .6rem;
  border-bottom: 2px solid var(--helwan-gold);
  color: var(--helwan-blue);
  font-size: 1.8rem;
  font-weight: 600;
}
#result p { margin: .6rem 0 0; color: var(--text-light); font-size: 1.05rem; }
#result p:first-of-type { color: var(--helwan-blue); font-size: 1.25rem; font-weight: 600; }
#result ul {
  margin: .25rem 0 0;
  padding: .8rem 2rem .8rem .8rem;
  border-inline-start: 4px solid var(--helwan-gold);
  border-radius: 4px;
  background: #fffbe6;
  color: var(--text-light);
}
#result li { padding: .2rem 0; }

@media (max-width: 768px) {
  .container { padding: 1rem; }
  .app-header { padding-top: 3.2rem; }
  h1 { font-size: 2.2rem; margin-bottom: 1.5rem; }
  fieldset { padding: 1rem; margin-top: 1.1rem; }
  legend { font-size: 1.2rem; }
  #stations-fieldset { grid-template-columns: minmax(0, 1fr); }
  #stations-fieldset > legend, #stations-fieldset > #reminder { grid-column: 1; }
  #type-options, #duration-options, #annual-lines-options { grid-template-columns: minmax(0, 1fr); }
  #calculate-btn { font-size: 1.08rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="container">
<header class="app-header">
<h1 id="app-title"></h1>
<button id="lang-toggle" type="button"></button>
</header>

<fieldset id="stations-fieldset">
  <legend id="stations-legend"></legend>
  <p id="reminder"></p>

  <div class="station-field">
    <label id="from-label" for="from-input"></label>
    <input type="text" id="from-input" autocomplete="off">
    <div id="from-list"></div>
  </div>

  <div class="station-field">
    <label id="to-label" for="to-input"></label>
    <input type="text" id="to-input" autocomplete="off">
    <div id="to-list"></div>
  </div>
</fieldset>

<fieldset>
  <legend id="type-legend"></legend>
  <div id="type-options"></div>
</fieldset>

<fieldset>
  <legend id="duration-legend"></legend>
  <div id="duration-options"></div>
</fieldset>

<fieldset id="annual-lines-fieldset" hidden>
  <legend id="annual-lines-legend"></legend>
  <div id="annual-lines-options"></div>
</fieldset>

<fieldset>
  <legend id="calculate-legend"></legend>
  <button id="calculate-btn" type="button"></button>
  <div id="result"></div>
</fieldset>
</div>

// ---------------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------------

let lang = 'en';
let selectedFrom = null;
let selectedTo = null;

// ---------------------------------------------------------------------------
// HELPERS
// ---------------------------------------------------------------------------

function t(key) { return STRINGS[lang][key]; }

function stationName(st) { return lang === 'ar' ? st.name_ar : st.name_en; }

function normalize(str) {
  if (lang === 'ar') {
    return str
      .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/[ىي]/g, 'ي')
      .replace(/ؤ/g, 'و')
      .replace(/ئ/g, 'ي')
      .replace(/ء/g, '')
      .trim();
  }
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

// Priority match (exact → prefix → word-prefix → substring) then best-match
// (subsequence) so that partial / out-of-order typing still finds a station.
function matchScore(name, query) {
  const n = normalize(name);
  const q = normalize(query);
  if (!q) return 0;
  if (n === q) return 100;
  if (n.startsWith(q)) return 90 - (n.length - q.length) * 0.01;
  if (n.split(/\s+/).some(w => w.startsWith(q))) return 80;
  const idx = n.indexOf(q);
  if (idx >= 0) return 70 - idx * 0.01;
  let qi = 0;
  for (let i = 0; i < n.length && qi < q.length; i++) {
    if (n[i] === q[qi]) qi++;
  }
  return qi === q.length ? 50 : -1;
}

// Annual subscriptions are priced by the selected number of full lines,
// independently of the selected stations or zones.

// ---------------------------------------------------------------------------
// RENDER
// ---------------------------------------------------------------------------

function render() {
  const prevType = document.querySelector('input[name="subType"]:checked')?.value;
  const prevDuration = document.querySelector('input[name="subDuration"]:checked')?.value;
  const prevAnnualLines = document.querySelector('input[name="annualLines"]:checked')?.value;

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('title');
  document.getElementById('app-title').textContent = t('title');
  document.getElementById('lang-toggle').textContent = t('langBtn');
  document.getElementById('stations-legend').textContent = t('stationsLegend');
  document.getElementById('annual-lines-legend').textContent = t('annualLinesLegend');
  document.getElementById('calculate-legend').textContent = t('calculateLegend');
  document.getElementById('reminder').textContent = t('reminder');
  document.getElementById('from-label').textContent = t('fromLabel');
  document.getElementById('to-label').textContent = t('toLabel');
  document.getElementById('from-input').placeholder = t('searchPlaceholder');
  document.getElementById('to-input').placeholder = t('searchPlaceholder');
  document.getElementById('type-legend').textContent = t('typeLegend');
  document.getElementById('duration-legend').textContent = t('durationLegend');
  document.getElementById('calculate-btn').textContent = t('calculate');

  const typeContainer = document.getElementById('type-options');
  typeContainer.innerHTML = '';
  SUBSCRIPTION_TYPES.forEach(type => {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'subType';
    input.value = type;
    if (prevType === type) input.checked = true;
    input.addEventListener('change', updateReminderUI);
    label.appendChild(input);
    label.appendChild(document.createTextNode(' ' + STRINGS[lang].types[type]));
    typeContainer.appendChild(label);
    typeContainer.appendChild(document.createElement('br'));
  });

  const durContainer = document.getElementById('duration-options');
  durContainer.innerHTML = '';
  DURATIONS.forEach(dur => {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'subDuration';
    input.value = dur;
    if (prevDuration === dur) input.checked = true;
    input.addEventListener('change', updateDurationUI);
    label.appendChild(input);
    label.appendChild(document.createTextNode(' ' + STRINGS[lang].durations[dur]));
    durContainer.appendChild(label);
    durContainer.appendChild(document.createElement('br'));
  });

  const annualLinesContainer = document.getElementById('annual-lines-options');
  annualLinesContainer.innerHTML = '';
  [2, 3].forEach(lines => {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'annualLines';
    input.value = String(lines);
    if (prevAnnualLines === String(lines)) input.checked = true;
    label.appendChild(input);
    label.appendChild(document.createTextNode(' ' + STRINGS[lang].annualLines[lines]));
    annualLinesContainer.appendChild(label);
    annualLinesContainer.appendChild(document.createElement('br'));
  });

  if (selectedFrom) document.getElementById('from-input').value = stationName(selectedFrom);
  if (selectedTo) document.getElementById('to-input').value = stationName(selectedTo);

  document.getElementById('from-list').innerHTML = '';
  document.getElementById('to-list').innerHTML = '';
  document.getElementById('result').innerHTML = '';
  updateDurationUI();
  updateReminderUI();
}

function updateDurationUI() {
  const duration = document.querySelector('input[name="subDuration"]:checked')?.value;
  const isAnnual = duration === 'annual';
  document.getElementById('stations-fieldset').hidden = isAnnual;
  document.getElementById('annual-lines-fieldset').hidden = !isAnnual;
}

function updateReminderUI() {
  const selectedType = document.querySelector('input[name="subType"]:checked')?.value;
  document.getElementById('reminder').hidden = selectedType === 'students';
}

// ---------------------------------------------------------------------------
// SUGGESTIONS
// ---------------------------------------------------------------------------

function renderSuggestions(query, listEl, onSelect) {
  listEl.innerHTML = '';
  if (!query.trim()) return;

  const results = STATIONS
    .map(st => ({ st, score: matchScore(stationName(st), query) }))
    .filter(r => r.score >= 0)
    .sort((a, b) => b.score - a.score || stationName(a.st).localeCompare(stationName(b.st)));

  results.slice(0, 30).forEach(({ st }) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = stationName(st);
    btn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      onSelect(st);
    });
    listEl.appendChild(btn);
    listEl.appendChild(document.createElement('br'));
  });
}

function setupField(inputId, listId, setSelected) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);

  input.addEventListener('input', () => {
    setSelected(null);
    renderSuggestions(input.value, list, (st) => {
      input.value = stationName(st);
      setSelected(st);
      list.innerHTML = '';
    });
  });

  input.addEventListener('focus', () => {
    if (input.value.trim()) {
      renderSuggestions(input.value, list, (st) => {
        input.value = stationName(st);
        setSelected(st);
        list.innerHTML = '';
      });
    }
  });

  input.addEventListener('blur', () => {
    setTimeout(() => { list.innerHTML = ''; }, 150);
  });
}

// ---------------------------------------------------------------------------
// RESULT DISPLAY
// ---------------------------------------------------------------------------

function showErrors(errors) {
  const el = document.getElementById('result');
  el.innerHTML = '';
  const ul = document.createElement('ul');
  errors.forEach(e => {
    const li = document.createElement('li');
    li.textContent = e;
    ul.appendChild(li);
  });
  el.appendChild(ul);
}

function showResult(msg, reminderText) {
  const el = document.getElementById('result');
  el.innerHTML = '';
  const resultTitle = t('resultTitle');
  if (resultTitle) {
    const h = document.createElement('h2');
    h.textContent = resultTitle;
    el.appendChild(h);
  }
  const p = document.createElement('p');
  p.textContent = msg;
  el.appendChild(p);
  if (reminderText) {
    const reminderEl = document.createElement('p');
    reminderEl.textContent = reminderText;
    el.appendChild(reminderEl);
  }
}

// ---------------------------------------------------------------------------
// CALCULATE — collects all problems, not sequential
// ---------------------------------------------------------------------------

function calculate() {
  const errors = [];

  const typeEl = document.querySelector('input[name="subType"]:checked');
  const durationEl = document.querySelector('input[name="subDuration"]:checked');
  const annualLinesEl = document.querySelector('input[name="annualLines"]:checked');
  const isAnnual = durationEl?.value === 'annual';

  // Station selection is required for zone-based plans only.
  if (durationEl && !isAnnual) {
    if (!selectedFrom) errors.push(t('errFrom'));
    if (!selectedTo) errors.push(t('errTo'));
  }

  if (!typeEl) errors.push(t('errType'));
  if (!durationEl) errors.push(t('errDuration'));
  if (isAnnual && !annualLinesEl) errors.push(t('errAnnualLines'));

  // Type + duration combination availability (independent of route).
  if (typeEl && durationEl) {
    const tariff = TARIFFS[durationEl.value];
    if (!tariff || !tariff.prices[typeEl.value]) {
      errors.push(t('errNoTypeDuration')
        .replace('{duration}', STRINGS[lang].durations[durationEl.value])
        .replace('{type}', STRINGS[lang].types[typeEl.value]));
    }
  }

  // Calculate only when the selected plan's required inputs are available.
  const hasRequiredTripInput = isAnnual
    ? Boolean(annualLinesEl)
    : Boolean(selectedFrom && selectedTo);

  if (hasRequiredTripInput && typeEl && durationEl) {
    const tariff = TARIFFS[durationEl.value];
    if (tariff) {
      const unit = tariff.unit; // "zones" for monthly/quarterly/6-month, "lines" for annual
      const rawValue = unit === 'zones'
        ? ZONE_COUNT_MAP[`${selectedFrom.zone}-${selectedTo.zone}`]
        : Number(annualLinesEl.value);
      const tier = (rawValue === undefined)
        ? undefined
        : (tariff.tier ? tariff.tier(rawValue) : rawValue);

      const priceMap = tariff.prices[typeEl.value];
      if (priceMap) {
        if (tier === undefined) {
          errors.push(t('errNoRoute'));
        } else {
          const price = priceMap[tier];
          if (price === undefined) {
            errors.push(t('errNoPrice')
              .replace('{duration}', STRINGS[lang].durations[durationEl.value])
              .replace('{type}', STRINGS[lang].types[typeEl.value])
              .replace('{unit}', unit === 'zones' ? t('zones') : t('lines'))
              .replace('{value}', tier));
          } else {
            const reminderText = unit === 'lines'
              ? t(tier === 3 ? 'reminderAnnualThree' : 'reminderAnnualTwo')
              : (typeEl.value === 'students' ? '' : t('reminder'));
            showResult(
              t('success').replace('{price}', price.toLocaleString('en-US')),
              reminderText
            );
            return;
          }
        }
      }
    }
  }

  showErrors(errors);
}

// ---------------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------------

function init() {
  setupField('from-input', 'from-list', (st) => { selectedFrom = st; });
  setupField('to-input', 'to-list', (st) => { selectedTo = st; });

  document.getElementById('lang-toggle').addEventListener('click', () => {
    lang = lang === 'en' ? 'ar' : 'en';
    render();
  });

  document.getElementById('calculate-btn').addEventListener('click', calculate);

  render();
}

init();
